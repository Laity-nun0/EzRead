name: Windows installer

on:
  push:
    tags: ['windows-v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install main build dependencies
        shell: pwsh
        run: |
          python -m venv .venv
          .venv/Scripts/python.exe -m pip install -r requirements-release.txt -r requirements-dev.txt
      - name: Offline source checks
        run: .venv/Scripts/python.exe scripts/check.py
      - name: Prepare public build inputs and PDF runtime
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/prepare-release.ps1
          .venv/Scripts/python.exe scripts/setup-pdf-layout.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $version = .venv/Scripts/python.exe -c "from ezread.config import VERSION; print(VERSION)"
          git archive --format=zip --output="work/release/sources/EzRead-$version-source.zip" HEAD
      - name: Build full installer
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/build-desktop.ps1 -OutputDirectory work/desktop-build
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          .venv/Scripts/python.exe scripts/build-release.py --output work/release/payload
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/build-installer.ps1
          exit $LASTEXITCODE
      - name: Install, launch, upgrade and uninstall
        shell: pwsh
        run: |
          $setup = Get-ChildItem output/releases/*-Setup-x64.exe | Select-Object -First 1
          .venv/Scripts/python.exe scripts/verify-installer.py --installer $setup.FullName
          exit $LASTEXITCODE
      - name: Prepare release hashes
        shell: pwsh
        run: |
          Copy-Item work/release/sources/EzRead-*-source.zip output/releases/
          Copy-Item work/release/payload/release-manifest.json output/releases/
          Copy-Item THIRD-PARTY-NOTICES.md output/releases/
          $lines = Get-ChildItem output/releases -File | Where-Object Name -ne SHA256SUMS.txt | ForEach-Object {
            $digest = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$digest  $($_.Name)"
          }
          [IO.File]::WriteAllLines((Join-Path $pwd 'output/releases/SHA256SUMS.txt'), $lines, (New-Object Text.UTF8Encoding($false)))
      - name: Publish Windows edition
        if: startsWith(github.ref, 'refs/tags/windows-v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 手工发布且已验收的附件保持原样，自动构建不重复创建或覆盖同一发行版。
          gh release view $env:GITHUB_REF_NAME --repo $env:GITHUB_REPOSITORY --json tagName 2>$null
          if ($LASTEXITCODE -eq 0) {
            Write-Host 'Release already exists; keeping its verified assets.'
            exit 0
          }
          gh release create $env:GITHUB_REF_NAME output/releases/* --verify-tag --latest=false --title "EzRead $env:GITHUB_REF_NAME Windows 安装版" --notes-file docs/WINDOWS_RELEASE.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: installer-verification
          path: |
            work/installer-verification/*.json
            work/installer-verification/*.log
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          name: windows-installer
          path: output/releases/*
